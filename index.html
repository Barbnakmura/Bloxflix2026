<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">
  <meta name="description" content="Bloxflix — seu universo de entretenimento.">

  <title>Bloxflix</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- JavaScript -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- CABEÇALHO -->
  <header class="topbar">

    <div class="brand">
      <span>BLOXFLIX</span>
    </div>

    <nav class="nav">
      <button class="nav-link active" data-page="inicio">
        Início
      </button>

      <button class="nav-link" data-page="series">
        Séries
      </button>

      <button class="nav-link" data-page="filmes">
        Filmes
      </button>

      <button class="nav-link" data-page="lista">
        Minha lista
      </button>

      <button class="nav-link" data-page="sobre">
        Sobre nós
      </button>
    </nav>

    <button class="profile" id="profileButton">
      Perfil
    </button>

  </header>


  <!-- DESTAQUE PRINCIPAL -->
  <main>

    <section class="hero">

      <div class="hero-content">

        <span class="eyebrow">
          SEU UNIVERSO DE ENTRETENIMENTO
        </span>

        <h1>
          Histórias começam aqui.
        </h1>

        <p>
          Descubra filmes, séries e histórias incríveis
          em um só lugar.
        </p>

        <div class="hero-actions">

          <button id="exploreButton">
            Explorar catálogo
          </button>

          <button id="aboutButton">
            Sobre a Bloxflix
          </button>

        </div>

      </div>

      <div class="hero-mark">
        B
      </div>

    </section>


    <!-- CATÁLOGO -->
    <section class="catalog-section" id="catalogSection">

      <div class="toolbar">

        <div>
          <span class="section-kicker">
            EXPLORE
          </span>

          <h2 id="pageTitle">
            Destaques
          </h2>
        </div>

        <div class="search">
          <input
            type="search"
            id="searchInput"
            placeholder="Pesquisar títulos..."
          >
        </div>

      </div>

      <div id="catalog">
        <!-- Os filmes e séries serão carregados pelo JavaScript -->
      </div>

    </section>

  </main>


  <!-- RODAPÉ -->
  <footer class="footer">

    <div class="footer-brand">
      BLOXFLIX
    </div>

    <p>
      Seu universo de entretenimento.
    </p>

    <p>
      © <span id="year"></span> Bloxflix. Todos os direitos reservados.
    </p>

  </footer>


  <!-- JANELA DE INFORMAÇÕES -->
  <dialog id="infoDialog">

    <div class="dialog-content">

      <button id="closeDialog">
        ✕
      </button>

      <h2>Bloxflix</h2>

      <p>
        Seu universo de entretenimento.
      </p>

      <button id="dialogOk">
        Entendi
      </button>

    </div>

  </dialog>


  <!-- NOTIFICAÇÕES -->
  <div id="toast"></div>


</body>
</html>
